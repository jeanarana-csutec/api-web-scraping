org: jeanarana
service: api-web-scraping

provider:
  name: aws
  runtime: python3.10
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::028825348944:role/LabRole
custom:
  pythonRequirements:
    dockerizePip: false
    pythonBin: python3

functions:
  scrape_table:
    handler: scrap_table.lambda_handler
    package:
      include:
        - ./**
    events:
      - http:
          path: /scrape/sismos
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
